# yaml-language-server: $schema=https://gitlab.com/gitlab-org/gitlab/-/raw/master/app/assets/javascripts/editor/schema/ci.json
#
# CI pipeline for jetson-ffmpeg (nvmpi library + ffmpeg integration).
#
# CI images (builders, hw runtime, release tools) are built and published by
# timmertech/jetson-builder; this pipeline pins immutable tags (JETSON_BUILDER_SHA).
#
# Two kinds of pipeline:
#
#   Branch / MR pipelines (NOT a tag, deduplicated — see workflow:rules):
#     build   - compile nvmpi library (stubs) + patch/build each ffmpeg version
#     test    - all HW test suites (test/hw-all.sh) on each Jetson variant
#
#   Tag pipelines (v<X.Y.Z>):  -> see https://github.com/gjrtimmer/jetson-ffmpeg/wiki/Release-Process
#     build        - nvmpi:jp6 + ffmpeg:jp6 (the artifacts the release gate tests)
#     release-test - RELEASE GATE: full tier (HW_TIER=full, every suite) on real
#                    Jetson hardware for every FFmpeg version; dist and release
#                    `needs` all of it, so any failure = red pipeline, no release
#     dist    - build REAL libnvmpi + ffmpeg per version in a plain container
#               (the stub builds above are NOT runnable, so releases rebuild
#               against the real tegra libs, pulled from NVIDIA's apt repo)
#     release - changelog (git-cliff) -> GitLab Release with package assets,
#               and mirror to GitHub (if GITHUB_REPO/GITHUB_TOKEN are set)
#
# Runner tag convention:
#   only test needs real hardware ("jetson" + "<variant>"); build/dist
#   have NO tags (any runner). release runs in the release-tools image (any runner).
#
# To add a new hardware variant:
#   1. Register a project runner with tags: jetson, <variant>
#   2. Add an entry to the shared .hw-full/.hw-fast parallel matrix with JETSON_VARIANT
#
# To add a new FFmpeg version:
#   1. Add the version string to the FFVER matrix in ffmpeg:jp6 and ffmpeg:jp5
#   2. Add a hw job pair for it: test:hw-fast:ffmpeg-<ver> (extends .hw-fast)
#      and test:hw-full:ffmpeg-<ver> (extends .hw-full-twin), both with the
#      matching needs reference (see the test:hw-fast / test:hw-full stages)
#   3. Add the version to the FFVER matrix in dist:jp6 and dist:jp5
#      (ffmpeg:jp5 only builds the oldest + newest version as a compile check)

stages:
  - build
  - test:stub
  - test:hw-fast
  - test:hw-full
  - release-test
  - dist
  - release

# Code paths: a change to any of these makes a pipeline worth running.
# Docs-only changes (README, CHANGELOG, CLAUDE.md, wiki-ish files) skip it.
# ANCHOR LIST: when a new top-level code directory is added, add it here.
.code-paths: &code-paths
  - "src/**/*"
  - "include/**/*"
  - "stubs/**/*"
  - "cmake/**/*"
  - "CMakeLists.txt"
  - "nvmpi.pc.in"
  - "ffmpeg/**/*"
  - "scripts/**/*"
  - "vendor/**/*"
  - ".gitlab-ci.yml"
  - "test/**/*.sh"
  - "test/**/*.c"
  - "test/**/*.cpp"

# Pipeline creation and the default hardware test tier (HW_TIER):
#   tag                -> release pipeline (dist + release only)
#   merge request      -> builds + tiered hw tests (7.1/8.1 full, rest fast)
#   web/schedule/api   -> HW_TIER as chosen in the UI / schedule variable
#                         (default none; the weekly schedule sets full)
#   pipeline/trigger   -> full (cross-project trigger, e.g. from jetson-nvmpi)
#   branch w/ open MR  -> none (the MR pipeline covers it)
#   main push          -> builds only (hw tests already ran in the MR)
#   other branch push  -> builds only, and only if code changed vs main
# Variables set here lose against UI/schedule/trigger variables.
# auto_cancel: a failed job cancels every other pending/running job of the
# pipeline, so a broken build never leaves the shared Orin churning through
# doomed hardware jobs (GitLab >= 16.10).
workflow:
  auto_cancel:
    on_job_failure: all
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        HW_TIER: "tiered"
    - if: '$CI_PIPELINE_SOURCE =~ /^(pipeline|trigger)$/'
      variables:
        HW_TIER: "full"
    - if: '$CI_PIPELINE_SOURCE =~ /^(schedule|web|api)$/'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        paths: *code-paths
      variables:
        HW_TIER: "none"
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      changes:
        paths: *code-paths
        compare_to: "refs/heads/main"
      variables:
        HW_TIER: "none"

variables:
  HW_TIER:
    value: "none"
    description: "Hardware test tier: none = builds only, tiered = 7.1/8.1 full + other versions fast (stress suites skipped), full = all suites on all versions"
    options:
      - "none"
      - "tiered"
      - "full"
  L4T_TAG: "r36.4.0"
  L4T_SOC: "t234"
  L4T_TAG_JP5: "r35.4.1"
  NVMPI_PREFIX: "${CI_PROJECT_DIR}/_nvmpi"
  FFMPEG_PREFIX: "${CI_PROJECT_DIR}/_ffmpeg"
  # Images are built by timmertech/jetson-builder. Immutable tags are
  # <tag>-<sha8> of the jetson-builder commit that built them; bump
  # JETSON_BUILDER_SHA to adopt new images (cached by if-not-present).
  JETSON_BUILDER_SHA: "ffd27ba0"
  BUILDER_IMAGE: "harbor.local/jetson/jetson-ffmpeg-builder:${L4T_TAG}-${JETSON_BUILDER_SHA}"
  BUILDER_IMAGE_JP5: "harbor.local/jetson/jetson-ffmpeg-builder-jp5:${L4T_TAG_JP5}-${JETSON_BUILDER_SHA}"
  RUNTIME_IMAGE: "harbor.local/jetson/l4t-jetpack6:${L4T_TAG}-${JETSON_BUILDER_SHA}"
  RELEASE_IMAGE: "harbor.local/jetson/jetson-ffmpeg-release-tools:latest-${JETSON_BUILDER_SHA}"

# Reusable pipeline rules:
#   .not-on-tag — branch/MR work; skipped on tag pipelines
#   .only-tag   — release work; runs only on v<X.Y.Z> tags
.not-on-tag: &not-on-tag
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    # Docs-only MRs build nothing (ci:docs-only keeps the pipeline non-empty).
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *code-paths
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: on_success
.only-tag: &only-tag
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

default:
  image:
    name: "${BUILDER_IMAGE}"
    pull_policy: if-not-present

# ---------------------------------------------------------------------------
# Stage: build — compile nvmpi (stubs), then patch/build each ffmpeg version
#
# nvmpi:jp6 / nvmpi:jp5 compile libnvmpi against stubs.
# ffmpeg:jp6 / ffmpeg:jp5 clone, patch, configure, and build each FFmpeg
# version via parallel:matrix on FFVER.
# ---------------------------------------------------------------------------
# Docs-only MRs: nothing to build or test. This keeps the MR pipeline
# non-empty so the "pipeline must succeed" merge gate is satisfied.
ci:docs-only:
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *code-paths
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - echo "docs-only change - no build or hardware test needed"

# ccache for compile jobs (guaranteed in the jetson-builder builder images).
.ccache:
  variables:
    CCACHE_DIR: "${CI_PROJECT_DIR}/.ccache"
    CCACHE_BASEDIR: "${CI_PROJECT_DIR}"
    CCACHE_SLOPPINESS: "include_file_mtime,include_file_ctime,time_macros"
    CCACHE_COMPILERCHECK: "content"
    CCACHE_MAXSIZE: "500M"
    CCACHE_COMPRESS: "1"
  cache:
    key: "ccache-${CI_JOB_NAME_SLUG}"
    paths:
      - .ccache

# jp6 builds also run on release tags: the release gate tests these artifacts.
.jp6-build-rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - !reference [.not-on-tag, rules]

nvmpi:jp6:
  extends: .ccache
  stage: build
  rules: !reference [.jp6-build-rules, rules]
  script:
    - mkdir -p build && cd build
    - cmake -DCMAKE_INSTALL_PREFIX="${NVMPI_PREFIX}" -DCMAKE_BUILD_TYPE=Release -DWITH_STUBS=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ..
    - make -j"$(nproc)"
    - make install
    - ccache -s
  artifacts:
    paths:
      - _nvmpi/
      - build/
    expire_in: 1 hour

# JetPack 5.x (kernel 5.10) compile-test — catches V4L2 header constants
# and API symbols that exist on JP6 (kernel 5.15+) but not JP5. Stubs-only,
# no FFmpeg, no hw tests. Covers all JP5 releases (5.0.2-5.1.6).
nvmpi:jp5:
  extends: .ccache
  stage: build
  <<: *not-on-tag
  image:
    name: "${BUILDER_IMAGE_JP5}"
    pull_policy: if-not-present
  script:
    - mkdir -p build && cd build
    - cmake -DCMAKE_INSTALL_PREFIX="${NVMPI_PREFIX}" -DCMAKE_BUILD_TYPE=Release -DWITH_STUBS=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ..
    - make -j"$(nproc)"
    - make install
    - ccache -s
  artifacts:
    paths:
      - _nvmpi/
      - build/
    expire_in: 1 hour

.ffmpeg-build: &ffmpeg-build
  extends: .ccache
  stage: build
  <<: *not-on-tag
  variables:
    # Paths inside the cloned tree must hash identically across jobs.
    CCACHE_BASEDIR: "/tmp/ffmpeg"
  script:
    - echo "=== ffmpeg ${FFVER} ==="
    - git clone --depth=1 -b "release/${FFVER}" https://git.ffmpeg.org/ffmpeg.git /tmp/ffmpeg
    - bash ./scripts/ffpatch.sh /tmp/ffmpeg
    - cd /tmp/ffmpeg
    - export PKG_CONFIG_PATH="${NVMPI_PREFIX}/lib/pkgconfig:${NVMPI_PREFIX}/share/pkgconfig"
    - |
      # Probe optional codec/protocol libraries — enable whatever is available.
      # Core test target is nvmpi; optional libs are best-effort in patch builds.
      OPT=""
      probe() { if pkg-config --exists "$1" 2>/dev/null; then OPT="${OPT} $2"; fi; }
      probe x264          --enable-libx264
      probe x265          --enable-libx265
      probe vpx           --enable-libvpx
      probe opus          --enable-libopus
      probe 'libmp3lame'  --enable-libmp3lame
      probe vorbis        --enable-libvorbis
      probe 'dav1d >= 1.0.0' --enable-libdav1d
      probe libass        --enable-libass
      probe freetype2     --enable-libfreetype
      probe gnutls        --enable-gnutls
      echo "[i] optional flags:${OPT:- (none)}"
    - |
      ./configure \
        --prefix="${FFMPEG_PREFIX}" \
        --enable-shared --disable-static --disable-doc \
        --enable-gpl --enable-nvmpi \
        --cc="ccache gcc" \
        --extra-cflags="-I${CI_PROJECT_DIR}/include" \
        --extra-ldflags="-L${CI_PROJECT_DIR}/build -L${CI_PROJECT_DIR}/stubs -Wl,-rpath-link,${CI_PROJECT_DIR}/stubs" \
        ${OPT}
    - make -j"$(nproc)"
    - make install
    - cp -a ${NVMPI_PREFIX}/lib/libnvmpi* ${FFMPEG_PREFIX}/lib/
    - ccache -s
  artifacts:
    paths:
      - _ffmpeg/
    expire_in: 1 hour

ffmpeg:jp6:
  <<: *ffmpeg-build
  rules: !reference [.jp6-build-rules, rules]
  needs: ["nvmpi:jp6"]
  parallel:
    matrix:
      - FFVER: ["6.0", "6.1", "7.0", "7.1", "8.0", "8.1"]

# JP5 is a compile check only: oldest + newest FFmpeg cover the API range.
ffmpeg:jp5:
  <<: *ffmpeg-build
  image:
    name: "${BUILDER_IMAGE_JP5}"
    pull_policy: if-not-present
  needs: ["nvmpi:jp5"]
  parallel:
    matrix:
      - FFVER: ["6.0", "8.1"]

# Behavioural Jetson mock (jetson-nvmpi mock/): drop-in libnvv4l2 /
# libnvbufsurface / libnvbufsurftransform carrying the REAL sonames. Built from
# a pinned commit of the public jetson-nvmpi mirror (no token, no job-token
# allowlist, immutable by sha). Bump NVMPI_MOCK_REF to adopt mock changes.
nvmpi-mock:jp6:
  stage: build
  <<: *not-on-tag
  needs: []
  variables:
    NVMPI_MOCK_REPO: "https://github.com/gjrtimmer/jetson-nvmpi.git"
    NVMPI_MOCK_REF: "920ff33a0f0b2d606e65ccccb16b0c752ca4fc1b"
  script:
    - git init -q /tmp/nvmpi-mock-src
    - git -C /tmp/nvmpi-mock-src fetch -q --depth=1 "${NVMPI_MOCK_REPO}" "${NVMPI_MOCK_REF}"
    - git -C /tmp/nvmpi-mock-src checkout -q FETCH_HEAD
    - cmake -S /tmp/nvmpi-mock-src -B /tmp/nvmpi-mock-build -DNVMPI_MOCK=ON -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
    - cmake --build /tmp/nvmpi-mock-build -j"$(nproc)" --target nvv4l2_mock nvbufsurface_mock nvbufsurftransform_mock
    - mkdir -p _mock
    - cp -a /tmp/nvmpi-mock-build/mock/. _mock/
    - cp /tmp/nvmpi-mock-src/scripts/mock-dev-nodes.sh _mock/
    - ls -l _mock
  artifacts:
    paths:
      - _mock/
    expire_in: 1 hour

# ---------------------------------------------------------------------------
# Stage: test:stub — the hw suites against the behavioural mock, on plain K3s
# runners (NO tags, no Jetson, no Tegra runtime).
#
# ADDITIVE ONLY (hard invariant): every suite listed here ALSO runs on the
# Orin in the hw tiers below; a green mock run never replaces a hardware run
# and the mock never runs on release tags (the release gate = real hardware).
# The mock catches logic, lifecycle and wrapper bugs in seconds and, through
# workflow:auto_cancel, cancels the queued hw jobs so a bug the mock can see
# does not occupy the shared Orin. Driver behaviour is proven only on hardware.
#
# Each stub job `needs:` its own ffmpeg build + the mock build, so it starts
# in parallel with the hw jobs. Suites guard hw-only assertions (perf numbers,
# VIC, exact bitstream/pixel checks) with NVMPI_MOCK; see test/README.md
# "Mock (stub) runs". The mockable suites are MOCK_SUITES in test/hw-all.sh.
# ---------------------------------------------------------------------------
.stub-test:
  stage: test:stub
  timeout: 15m
  <<: *not-on-tag
  variables:
    NVMPI_MOCK: "1"
    JETSON_VARIANT: "mock"
  script:
    - echo "=== stub test (${CI_JOB_NAME}) against the nvmpi mock ==="
    - export PATH="${FFMPEG_PREFIX}/bin:${PATH}"
    # Mock first (real sonames); stubs/ only supplies libnvjpeg, which the mock
    # does not replace. No Tegra libs exist on this runner.
    - export LD_LIBRARY_PATH="${CI_PROJECT_DIR}/_mock:${FFMPEG_PREFIX}/lib:${CI_PROJECT_DIR}/stubs"
    - bash _mock/mock-dev-nodes.sh
    # Proof the mock (not the stubs) is what libnvmpi loads.
    - ldd "${FFMPEG_PREFIX}/lib/libnvmpi.so" | tee /tmp/ldd.txt
    - |
      for l in libv4l2.so.0 libnvbufsurface.so.1.0.0 libnvbufsurftransform.so.1.0.0; do
        grep -F "$l" /tmp/ldd.txt | grep -q "${CI_PROJECT_DIR}/_mock/" \
          || { echo "$l does not resolve to _mock (a stub or real lib would hide mock bugs)"; exit 1; }
      done
    - bash test/hw-all.sh

# ---------------------------------------------------------------------------
# Stage: test — HW encode/decode on real Jetson hardware.
#
# Controlled by HW_TIER (see the workflow rules above):
#   none   - no hw jobs (main push, plain branches)
#   tiered - MR default. 7.1 and 8.1 run ALL suites (.hw-full); the other
#            versions run the fast tier (.hw-fast) = everything except the
#            stress suites listed in HW_SUITES_EXCLUDE.
#   full   - everything, on every version (weekly schedule / web / cross-project trigger)
#
# Each version reuses its build artifact (installed ffmpeg + libnvmpi), no
# rebuild on the Jetson runner.
#
# The nvmpi FFmpeg wrapper compiles into a few DISTINCT builds by libavcodec
# version (see "Wrapper code paths by FFmpeg version" in https://github.com/gjrtimmer/jetson-ffmpeg/wiki/Development-Guide#wrapper-code-paths-by-ffmpeg-version):
#
#   6.0,6.1,7.0,7.1 -> path C (FFCodec) — identical wrapper code
#   8.0,8.1          -> path D (FFCodec + AV_PROFILE)
#
# 7.1 (path C) and 8.1 (path D) carry the full suites. The other versions
# share wrapper code with them and run the fast tier to cover FFmpeg
# ABI/runtime differences between releases; HW_TIER=full runs them in full too.
#
# A job's timeout cannot vary per rule, so versions that run fast OR full have
# two jobs: test:hw-fast:ffmpeg-<ver> (fast, 10m) and
# test:hw-full:ffmpeg-<ver> (full, 30m). The tier is in the stage AND the job
# name. Every test job `needs:` its own build job, so it starts the moment
# that build finishes; the stages are visual grouping only.
#
# To add a hardware variant, add it to the matrix and register a runner with
# tags: jetson, <variant>.
# ---------------------------------------------------------------------------

# Stress/soak suites, skipped in the fast tier. Keep in sync with test/ names
# (suite name = hw-<name>.sh minus prefix). New suites default to the fast tier.
# Referenced by .hw-fast below.
.hw-test:
  image:
    name: "${RUNTIME_IMAGE}"
    pull_policy: if-not-present
  tags: [jetson, "${JETSON_VARIANT}"]
  # Serialize all Jetson work (one job at a time) so per-version tests
  # don't thrash a single device.
  resource_group: jetson
  parallel:
    matrix:
      - JETSON_VARIANT: orin-nx
      # - JETSON_VARIANT: agx
      # - JETSON_VARIANT: nano
  variables:
    NVIDIA_VISIBLE_DEVICES: "all"
    NVIDIA_DRIVER_CAPABILITIES: "all"
  before_script: []
  script:
    - echo "=== HW test (${CI_JOB_NAME}) on ${JETSON_VARIANT} ==="
    - export PATH="${FFMPEG_PREFIX}/bin:${PATH}"
    - export LD_LIBRARY_PATH="${FFMPEG_PREFIX}/lib:/usr/lib/aarch64-linux-gnu/tegra:${LD_LIBRARY_PATH:-}"
    - ldconfig || true
    - bash test/hw-all.sh

# Rules. Each set: skip on tags, skip docs-only MRs
# (no build jobs exist to need), then gate on HW_TIER.
.hw-rules-full-any: &hw-rules-full-any   # runs whenever HW_TIER != none
  - if: '$CI_COMMIT_TAG || $HW_TIER == "none"'
    when: never
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    changes: *code-paths
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    when: never
  - when: on_success
.hw-rules-tiered: &hw-rules-tiered       # runs only when HW_TIER == tiered
  - if: '$CI_COMMIT_TAG || $HW_TIER != "tiered"'
    when: never
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    changes: *code-paths
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    when: never
  - when: on_success
.hw-rules-full: &hw-rules-full           # runs only when HW_TIER == full
  - if: '$CI_COMMIT_TAG || $HW_TIER != "full"'
    when: never
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    changes: *code-paths
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    when: never
  - when: on_success

# Full tier: all suites, 30 min (longest observed hw job ~17 min).
.hw-full:
  extends: .hw-test
  stage: test:hw-full
  timeout: 30m
  rules: *hw-rules-full-any

# Fast tier: soak suite excluded, 10 min.
.hw-fast:
  extends: .hw-test
  stage: test:hw-fast
  timeout: 10m
  variables:
    # INVARIANT: the fast tier excludes ONLY the soak suite (a 30 s timed loop). Every
    # other suite (filter-scale-vic, decoder-flush/lifecycle/codecs/chunk/pool,
    # encoder-gop/level/header/pools, format-pixfmt, smoke, rtp-sdp, jpeg/mjpeg,
    # ..., lifecycle-stress, encoder-thread-safety) still runs on real Jetson
    # hardware for every FFmpeg version in every MR pipeline. Never add a suite
    # here to save time; mock tests are additive.
    HW_SUITES_EXCLUDE: "soak-decode"
  rules: *hw-rules-tiered

# Full twin of a fast job: same version, runs only at HW_TIER=full.
.hw-full-twin:
  extends: .hw-test
  stage: test:hw-full
  timeout: 30m
  rules: *hw-rules-full

test:stub:ffmpeg-6.0:                            # path C
  extends: .stub-test
  needs:
    - job: "ffmpeg:jp6"
      parallel:
        matrix:
          - FFVER: "6.0"
    - job: "nvmpi-mock:jp6"

test:stub:ffmpeg-6.1:                            # path C
  extends: .stub-test
  needs:
    - job: "ffmpeg:jp6"
      parallel:
        matrix:
          - FFVER: "6.1"
    - job: "nvmpi-mock:jp6"

test:stub:ffmpeg-7.0:                            # path C
  extends: .stub-test
  needs:
    - job: "ffmpeg:jp6"
      parallel:
        matrix:
          - FFVER: "7.0"
    - job: "nvmpi-mock:jp6"

test:stub:ffmpeg-7.1:                            # path C
  extends: .stub-test
  needs:
    - job: "ffmpeg:jp6"
      parallel:
        matrix:
          - FFVER: "7.1"
    - job: "nvmpi-mock:jp6"

test:stub:ffmpeg-8.0:                            # path D
  extends: .stub-test
  needs:
    - job: "ffmpeg:jp6"
      parallel:
        matrix:
          - FFVER: "8.0"
    - job: "nvmpi-mock:jp6"

test:stub:ffmpeg-8.1:                            # path D
  extends: .stub-test
  needs:
    - job: "ffmpeg:jp6"
      parallel:
        matrix:
          - FFVER: "8.1"
    - job: "nvmpi-mock:jp6"

test:hw-fast:ffmpeg-6.0:                         # path C
  extends: .hw-fast
  needs:
    - job: "ffmpeg:jp6"
      parallel:
        matrix:
          - FFVER: "6.0"

test:hw-full:ffmpeg-6.0:                         # path C
  extends: .hw-full-twin
  needs:
    - job: "ffmpeg:jp6"
      parallel:
        matrix:
          - FFVER: "6.0"

test:hw-fast:ffmpeg-6.1:                         # path C
  extends: .hw-fast
  needs:
    - job: "ffmpeg:jp6"
      parallel:
        matrix:
          - FFVER: "6.1"

test:hw-full:ffmpeg-6.1:                         # path C
  extends: .hw-full-twin
  needs:
    - job: "ffmpeg:jp6"
      parallel:
        matrix:
          - FFVER: "6.1"

test:hw-fast:ffmpeg-7.0:                         # path C
  extends: .hw-fast
  needs:
    - job: "ffmpeg:jp6"
      parallel:
        matrix:
          - FFVER: "7.0"

test:hw-full:ffmpeg-7.0:                         # path C
  extends: .hw-full-twin
  needs:
    - job: "ffmpeg:jp6"
      parallel:
        matrix:
          - FFVER: "7.0"

test:hw-fast:ffmpeg-8.0:                         # path D
  extends: .hw-fast
  needs:
    - job: "ffmpeg:jp6"
      parallel:
        matrix:
          - FFVER: "8.0"

test:hw-full:ffmpeg-8.0:                         # path D
  extends: .hw-full-twin
  needs:
    - job: "ffmpeg:jp6"
      parallel:
        matrix:
          - FFVER: "8.0"

test:hw-full:ffmpeg-7.1:                         # path C
  extends: .hw-full
  needs:
    - job: "ffmpeg:jp6"
      parallel:
        matrix:
          - FFVER: "7.1"

test:hw-full:ffmpeg-8.1:                         # path D
  extends: .hw-full
  needs:
    - job: "ffmpeg:jp6"
      parallel:
        matrix:
          - FFVER: "8.1"

# ---------------------------------------------------------------------------
# Stage: release-test — RELEASE GATE (semver tag pipelines only).
#
# Full tier on real Jetson hardware for every FFmpeg version: every suite, no
# exclusions, no mock/stub. Each job extends the matching test:hw-full job (same
# script, needs and runner), overriding only what a release needs. dist:* and
# release `needs` ALL of these jobs, so one red hardware run means no package, no
# S3 upload and no release. Non-tag pipelines never create these jobs.
# New FFmpeg version: add its release:test job here and to .release-gate.
# ---------------------------------------------------------------------------
.release-gate-job:
  stage: release-test
  timeout: 30m
  tags: [jetson, orin-nx]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  variables:
    HW_TIER: "full"
    HW_SUITES_EXCLUDE: ""

# Gate job list for dist:* (release lists the same jobs explicitly).
.release-gate:
  needs:
    - job: "release:test:ffmpeg-6.0"
      artifacts: false
    - job: "release:test:ffmpeg-6.1"
      artifacts: false
    - job: "release:test:ffmpeg-7.0"
      artifacts: false
    - job: "release:test:ffmpeg-7.1"
      artifacts: false
    - job: "release:test:ffmpeg-8.0"
      artifacts: false
    - job: "release:test:ffmpeg-8.1"
      artifacts: false

release:test:ffmpeg-6.0:
  extends: ["test:hw-full:ffmpeg-6.0", ".release-gate-job"]

release:test:ffmpeg-6.1:
  extends: ["test:hw-full:ffmpeg-6.1", ".release-gate-job"]

release:test:ffmpeg-7.0:
  extends: ["test:hw-full:ffmpeg-7.0", ".release-gate-job"]

release:test:ffmpeg-7.1:
  extends: ["test:hw-full:ffmpeg-7.1", ".release-gate-job"]

release:test:ffmpeg-8.0:
  extends: ["test:hw-full:ffmpeg-8.0", ".release-gate-job"]

release:test:ffmpeg-8.1:
  extends: ["test:hw-full:ffmpeg-8.1", ".release-gate-job"]

# ---------------------------------------------------------------------------
# Stage: dist — build REAL libnvmpi + ffmpeg per version and tar each one
# (tag pipelines only). The build stages above link stubs and are NOT
# runnable; releases must rebuild against the real Multimedia API.
#
# This is a plain container build on any (arm64) runner — NO Jetson hardware
# is needed: nothing encodes/decodes here. The real tegra userspace libraries
# (libnvv4l2, libnvjpeg, libnvbufsurface, libnvbufsurftransform) are installed
# from NVIDIA's jetson apt repo; the touch file skips nvidia-l4t-core's
# "must run on an NVIDIA Tegra platform" preinstall check inside containers.
# --no-stubs makes build.sh hard-fail if those libs are missing, so a release
# can never silently ship stub-linked (non-runnable) tarballs.
# Produces dist/jetson-ffmpeg_<ver>_ffmpeg<ff>_l4t<tag>_aarch64.tar.gz.
# ---------------------------------------------------------------------------
.dist:
  stage: dist
  <<: *only-tag
  needs: !reference [.release-gate, needs]
  before_script:
    - mkdir -p /opt/nvidia/l4t-packages && touch /opt/nvidia/l4t-packages/.nv-l4t-disable-boot-fw-update-in-preinstall
    - |
      if ! grep -rqs "repo.download.nvidia.com/jetson/${L4T_SOC}" /etc/apt/sources.list /etc/apt/sources.list.d/; then
        wget -qO /etc/apt/trusted.gpg.d/jetson-ota-public.asc https://repo.download.nvidia.com/jetson/jetson-ota-public.asc
        echo "deb https://repo.download.nvidia.com/jetson/${L4T_SOC} ${L4T_TAG%.*} main" > /etc/apt/sources.list.d/nvidia-l4t-${L4T_SOC}.list
      fi
    - apt-get update -qq
    - >-
      apt-get install -y -qq --no-install-recommends
      nvidia-l4t-multimedia nvidia-l4t-multimedia-utils
    - ldconfig
  script:
    - export VERSION="${CI_COMMIT_TAG#v}"
    - PFX="${CI_PROJECT_DIR}/_pkg"
    - |
      OPT=""
      probe() { if pkg-config --exists "$1" 2>/dev/null; then OPT="${OPT} $2"; fi; }
      probe x264          --enable-libx264
      probe x265          --enable-libx265
      probe vpx           --enable-libvpx
      probe opus          --enable-libopus
      probe 'libmp3lame'  --enable-libmp3lame
      probe vorbis        --enable-libvorbis
      probe 'dav1d >= 1.0.0' --enable-libdav1d
      probe 'libass >= 0.11.0' --enable-libass
      probe freetype2     --enable-libfreetype
      probe gnutls        --enable-gnutls
      echo "[i] optional flags:${OPT:- (none)}"
    - >-
      bash ./scripts/build.sh --no-stubs --no-libx264 --no-libx265
      --ffmpeg "${FFVER}" --install
      --prefix "${PFX}" --ffmpeg-prefix "${PFX}" -j"$(nproc)"
      --ffmpeg-args "--enable-shared --disable-static --enable-gpl ${OPT}"
    - test -f "${PFX}/lib/libnvmpi.so"
    - >-
      bash ./scripts/package.sh --prefix "${PFX}" --version "${VERSION}"
      --ffmpeg-version "${FFVER}" --l4t "${L4T_TAG}" --outdir "${CI_PROJECT_DIR}/dist"
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

dist:jp6:
  extends: .dist
  parallel:
    matrix:
      - FFVER: ["6.0", "6.1", "7.0", "7.1", "8.0", "8.1"]

dist:jp5:
  extends: .dist
  image:
    name: "${BUILDER_IMAGE_JP5}"
    pull_policy: if-not-present
  variables:
    L4T_TAG: "${L4T_TAG_JP5}"
    L4T_SOC: "t194"
  parallel:
    matrix:
      - FFVER: ["6.0", "6.1", "7.0", "7.1", "8.0", "8.1"]

# ---------------------------------------------------------------------------
# Stage: release — changelog + S3 upload + GitLab Release (+ generic package
# assets). Runs in the release-tools image from DockerHub
# (rebuilt weekly by scheduled pipeline). Tag pipelines only.
#
# S3/MinIO CI variables (masked, project-level):
#   S3_HOST, S3_CLIENT_ID, S3_CLIENT_SECRET, S3_BUCKET
# ---------------------------------------------------------------------------
release:
  stage: release
  <<: *only-tag
  image:
    name: "${RELEASE_IMAGE}"
    pull_policy: if-not-present
  needs:
    - job: "release:test:ffmpeg-6.0"
      artifacts: false
    - job: "release:test:ffmpeg-6.1"
      artifacts: false
    - job: "release:test:ffmpeg-7.0"
      artifacts: false
    - job: "release:test:ffmpeg-7.1"
      artifacts: false
    - job: "release:test:ffmpeg-8.0"
      artifacts: false
    - job: "release:test:ffmpeg-8.1"
      artifacts: false
    - job: "dist:jp6"
    - job: "dist:jp5"
  variables:
    GIT_DEPTH: "0"   # full history + tags for git-cliff
    # dl.min.io now returns HTTP 410 and MinIO archived mc (no security
    # updates). Pin the last GitHub release and verify its sha256 (linux-arm64).
    MC_VERSION: "RELEASE.2025-08-13T08-35-41Z"
    MC_SHA256: "14c8c9616cfce4636add161304353244e8de383b2e2752c0e9dad01d4c27c12c"
  before_script:
    - |
      echo "[i] installing mc (MinIO client) ${MC_VERSION}"
      mc_tmp="$(mktemp)"
      curl -fsSL "https://github.com/minio/mc/releases/download/${MC_VERSION}/mc.linux-arm64.${MC_VERSION}" -o "${mc_tmp}"
      echo "${MC_SHA256}  ${mc_tmp}" | sha256sum -c -
      install -m 0755 "${mc_tmp}" /usr/local/bin/mc
      rm -f "${mc_tmp}"
      mc --version
  script:
    - git fetch --tags --force || true
    - bash ./scripts/release.sh
